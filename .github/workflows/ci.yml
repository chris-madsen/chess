name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify scaffold
        run: |
          test -f AGENTS.md
          test -f openspec/project.md
          test -f docs/glossary.md
          test -f openspec/specs/scenario-lines/spec.md
          node --version
